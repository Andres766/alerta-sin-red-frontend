name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (exactas, desde package-lock.json)
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build de producción (incluye el Service Worker)
        run: npm run build

      - name: Verificar que el Service Worker se generó
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest
